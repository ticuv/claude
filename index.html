<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TICUV — Visuals / 3D / AI Art</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Preconnect to CDNs for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- PHASE 1: THE HERO -->
    <section id="hero" class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">TICUV</h1>
            <div class="scroll-indicator">
                <span class="cursor-blink">_</span>
                <p>SCROLL TO EXPLORE</p>
                <div class="scroll-arrow">↓</div>
            </div>
        </div>
    </section>

    <!-- PHASE 2: THE SHOWCASE -->
    <section id="showcase" class="showcase-section">

        <!-- Project 01 -->
        <div class="project-item" data-project="1">
            <div class="project-image-wrapper">
                <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=1600&h=1200&fit=crop"
                     alt="Neon Void - 3D Abstract"
                     class="project-image">
            </div>
            <div class="project-info">
                <h2 class="project-title">PROJECT_01 // NEON VOID</h2>
                <span class="project-tag">3D / AI</span>
            </div>
        </div>

        <!-- Project 02 -->
        <div class="project-item" data-project="2">
            <div class="project-image-wrapper">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&h=1200&fit=crop"
                     alt="Digital Dreams - AI Generated"
                     class="project-image">
            </div>
            <div class="project-info">
                <h2 class="project-title">PROJECT_02 // DIGITAL DREAMS</h2>
                <span class="project-tag">AI / VISUALS</span>
            </div>
        </div>

        <!-- Project 03 -->
        <div class="project-item" data-project="3">
            <div class="project-image-wrapper">
                <img src="https://images.unsplash.com/photo-1620121692029-d088224ddc74?w=1600&h=1200&fit=crop"
                     alt="Synthetic Reality - 3D Art"
                     class="project-image">
            </div>
            <div class="project-info">
                <h2 class="project-title">PROJECT_03 // SYNTHETIC REALITY</h2>
                <span class="project-tag">3D / DESIGN</span>
            </div>
        </div>

        <!-- Project 04 -->
        <div class="project-item" data-project="4">
            <div class="project-image-wrapper">
                <img src="https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=1600&h=1200&fit=crop"
                     alt="Quantum Aesthetics - AI Art"
                     class="project-image">
            </div>
            <div class="project-info">
                <h2 class="project-title">PROJECT_04 // QUANTUM AESTHETICS</h2>
                <span class="project-tag">AI / 3D</span>
            </div>
        </div>

    </section>

    <!-- PHASE 3: THE FOOTER / CTA -->
    <section id="footer" class="footer-section">
        <a href="mailto:hello@ticuv.com" class="cta-link">
            <h2 class="cta-text">LET'S WORK<br>TOGETHER</h2>
        </a>
    </section>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.29/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <!-- Custom Scripts -->
    <script src="script.js"></script>

</body>
</html>
